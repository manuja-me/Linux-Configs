#
# Hyprland configuration : Theme Elements & Colors ---------

# Decoration
$hypr_border_size        = 1
$hypr_gaps_in            = 1
$hypr_gaps_out           = 0
$hypr_gaps_ws            = 0
$hypr_rounding           = 0
$hypr_active_opacity     = 1.0
$hypr_inactive_opacity   = 0.9
$hypr_fullscreen_opacity = 1.0
$hypr_blur_enabled       = true
$hypr_blur_size          = 8
$hypr_blur_pass          = 3

# Windows
$gradient_angle                   = 45deg
$active_border_col_1              = 0xFFF3100F
$active_border_col_2              = 0xFFB00C0A
$inactive_border_col_1            = 0xFF1e1710
$inactive_border_col_2            = 0xFF2e2217
$active_shadow_col                = 0x66000000
$inactive_shadow_col              = 0x66000000

# Groups 
$groupbar_font_family             = JetBrainsMono Nerd Font 
$groupbar_font_size               = 12
$group_border_active_col          = 0xFFF3100F
$group_border_inactive_col        = 0xFF1e1710
$group_border_locked_active_col   = 0xFFB00C0A
$group_border_locked_inactive_col = 0xFF1e1710
$groupbar_text_color_active       = 0xFF0c0906
$groupbar_text_color_inactive     = 0xFFf0a087

# Misc
$notifycmd = notify-send -h string:x-canonical-private-synchronous:hypr-cfg -u low
