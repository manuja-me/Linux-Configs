# Hyprland configuration : Gestures ------------------------

gestures {
	workspace_swipe_distance                 = 300
	workspace_swipe_touch                    = false
	workspace_swipe_invert                   = true
	workspace_swipe_touch_invert             = false
	workspace_swipe_min_speed_to_force       = 30
	workspace_swipe_cancel_ratio             = 0.5
	workspace_swipe_create_new               = true
	workspace_swipe_direction_lock           = true
	workspace_swipe_direction_lock_threshold = 10
	workspace_swipe_forever                  = false
	workspace_swipe_use_r                    = false
	close_max_timeout                        = 100
}

# 4-finger touchpad gestures for window navigation
gesture = 4, left, dispatcher, movefocus, l
gesture = 4, right, dispatcher, movefocus, r
gesture = 4, up, dispatcher, movefocus, u
gesture = 4, down, dispatcher, movefocus, d

# 3-finger touchpad gestures for workspace & window actions
gesture = 3, horizontal, workspace
gesture = 3, vertical, float
gesture = 3, pinch, fullscreen
gesture = 3, swipe, mod: SUPER, resize
gesture = 3, swipe, mod: ALT, move

