<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Sans-Serif: Noto Sans (Latin) + Noto Sans Sinhala (Sinhala) -->
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Sinhala</family>
      <family>Noto Sans Sinhala UI</family>
    </prefer>
  </alias>

  <!-- System-UI: Noto Sans Sinhala for system UI -->
  <alias>
    <family>system-ui</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Sans Sinhala UI</family>
      <family>Noto Sans Sinhala</family>
    </prefer>
  </alias>

  <!-- Serif: Noto Serif (Latin) + Noto Serif Sinhala (Sinhala) -->
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Serif Sinhala</family>
    </prefer>
  </alias>

  <!-- Monospace: JetBrainsMono (Latin) + Noto Sans Sinhala (Sinhala) -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrainsMono Nerd Font Mono</family>
      <family>Noto Sans Sinhala</family>
    </prefer>
  </alias>

  <!-- Explicit lang=si overrides -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Sinhala</string>
      <string>Noto Sans Sinhala UI</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <test name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Sinhala UI</string>
      <string>Noto Sans Sinhala</string>
    </edit>
  </match>

  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Serif Sinhala</string>
    </edit>
  </match>

  <!-- Subpixel antialiasing & LCD filtering for crisp strokes -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
