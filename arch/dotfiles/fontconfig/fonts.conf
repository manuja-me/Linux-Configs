<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Monospace -->
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>JetBrainsMono Nerd Font Mono</family>
    </prefer>
  </alias>

  <!-- Sinhala Sans-Serif Fallback -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <test name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Noto Sans Sinhala</string>
      <string>Gemunu Libre</string>
    </edit>
  </match>

  <!-- Sinhala Serif Fallback -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <test name="family"><string>serif</string></test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Abhaya Libre</string>
      <string>Noto Serif Sinhala</string>
    </edit>
  </match>

  <!-- Sinhala Weight Upgrade: Map thin/regular strokes to Medium (weight 100) for screen legibility -->
  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <test name="weight" compare="less_eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="lang" compare="contains"><string>si</string></test>
    <edit name="weight" mode="append"><const>medium</const></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>Sinhala</string></test>
    <test name="weight" compare="less_eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Sinhala</string></test>
    <edit name="weight" mode="append"><const>medium</const></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>Abhaya</string></test>
    <test name="weight" compare="less_eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Abhaya</string></test>
    <edit name="weight" mode="append"><const>medium</const></edit>
  </match>

  <match target="pattern">
    <test name="family" compare="contains"><string>Gemunu</string></test>
    <test name="weight" compare="less_eq"><const>regular</const></test>
    <edit name="weight" mode="assign"><const>medium</const></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains"><string>Gemunu</string></test>
    <edit name="weight" mode="append"><const>medium</const></edit>
  </match>

  <!-- Subpixel antialiasing & LCD filtering for crisp strokes -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
