# mpv configuration

# Save playback position on quit and restore on restart
save-position-on-quit=yes

# Watch later functionality - saves position every 30 seconds
watch-later-options-set=start,vid,aid,sid

# Create watch-later directory automatically
watch-later-directory=~/.config/mpv/watch_later

# Resume playback from last position when opening the same file
resume-playback=yes

# Optional: Show OSD message when resuming
#osd-msg1="Resuming from ${time-pos}"

# Fix color/saturation issues in fullscreen on Wayland - Intel Iris Xe optimized
# Force consistent video output method
vo=gpu-next

# Use hardware acceleration for Intel GPUs
hwdec=vaapi-copy
hwdec-codecs=all

# Color management settings to prevent saturation loss in fullscreen
target-colorspace-hint=no
target-prim=bt.709
target-trc=bt.1886
gamma-factor=1.0

# Force consistent color range (critical for Intel)
video-output-levels=full
video-aspect-override=no

# Prevent Wayland compositor color space interference
icc-profile-auto=no
icc-3dlut-size=256x256x256
tone-mapping=spline
hdr-compute-peak=no

# GPU rendering options optimized for Intel Iris Xe
gpu-api=opengl
gpu-context=wayland
opengl-pbo=yes

# Disable problematic features that cause color shifting
interpolation=no
video-sync=display-resample
temporal-dither=no
dither-depth=no

# Force consistent output regardless of window state
force-window-position=no
geometry=50%:50%
autofit=85%

# Subtitle settings
sub-auto=fuzzy
sub-file-paths-append=ass
sub-file-paths-append=srt
sub-file-paths-append=sub
sub-file-paths-append=subs
sub-file-paths-append=subtitles
